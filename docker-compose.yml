services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchain-express-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s


      